services:

  # ── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quizhub-rabbitmq
    ports:
      - "7200:5672"
      - "7201:15672"   # management UI at http://localhost:7201
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth service ──────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: quizhub-auth
    ports:
      - "7202:4001"
    env_file:
      - ./backend/auth-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CLIENT_URL: http://localhost:7203
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Topic service ────────────────────────────────────────
  topic-service:
    build:
      context: ./backend/topic-service
      dockerfile: Dockerfile
    container_name: quizhub-topic
    ports:
      - "7205:4002"
    env_file:
      - ./backend/topic-service/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:7203,http://localhost:7204
    restart: unless-stopped

  # ── Post filter (content moderation via Ollama) ──────────
  post-filter:
    build:
      context: ./agentic/post-filter
      dockerfile: Dockerfile
    container_name: quizhub-post-filter
    ports:
      - "5100:5100"
    env_file:
      - ./agentic/post-filter/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Post service ─────────────────────────────────────────
  post-service:
    build:
      context: ./backend/post-service
      dockerfile: Dockerfile
    container_name: quizhub-post
    ports:
      - "7207:4004"
    env_file:
      - ./backend/post-service/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:7203,http://localhost:7204
      POST_FILTER_URL: http://post-filter:5100
    depends_on:
      - post-filter
    restart: unless-stopped

  # ── Question service ─────────────────────────────────────
  question-service:
    build:
      context: ./backend/question-service
      dockerfile: Dockerfile
    container_name: quizhub-question
    ports:
      - "7206:4003"
    env_file:
      - ./backend/question-service/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:7203,http://localhost:7204
    restart: unless-stopped

  # ── Quiz service ─────────────────────────────────────────
  quiz-service:
    build:
      context: ./backend/quiz-service
      dockerfile: Dockerfile
    container_name: quizhub-quiz
    ports:
      - "7208:4005"
    env_file:
      - ./backend/quiz-service/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:7203,http://localhost:7204
      QUESTION_SERVICE_URL: http://question-service:4003
      TOPIC_SERVICE_URL: http://topic-service:4002
      POST_SERVICE_URL: http://post-service:4004
      AUTH_SERVICE_URL: http://auth-service:4001
      DO_SPACES_KEY: DO00M8M3Q9LGTPAGNH8L
      DO_SPACES_SECRET: DO00M8M3Q9LGTPAGNH8L
      DO_SPACES_ENDPOINT: https://quiz-ashok.sfo3.digitaloceanspaces.com
      DO_SPACES_REGION: blr1
      DO_SPACES_BUCKET: quizhub-media
      DO_SPACES_CDN_URL: https://quiz-ashok.sfo3.cdn.digitaloceanspaces.com
    depends_on:
      - question-service
      - topic-service
      - auth-service
    restart: unless-stopped

  # ── Agentic question generator (cron every 10 min) ───────
  agentic:
    build:
      context: ./agentic
      dockerfile: Dockerfile
    container_name: quizhub-agentic
    env_file:
      - ./agentic/.env
    depends_on:
      - auth-service
      - topic-service
      - question-service
    restart: unless-stopped

  player-agent:
    build:
      context: ./agentic/player
      dockerfile: Dockerfile
    container_name: quizhub-player-agent
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4001
      - QUIZ_SERVICE_URL=http://quiz-service:4005
      - QUIZ_SOCKET_URL=http://quiz-service:4005
      - QUIZ_SOCKET_PATH=/quiz.io/
    depends_on:
      - auth-service
      - quiz-service
    restart: unless-stopped

  post-creator:
    build:
      context: ./agentic/post-creator
      dockerfile: Dockerfile
    container_name: meenzo-post-creator
    env_file:
      - ./agentic/post-creator/.env
    ports:
      - "5050:5050"
    depends_on:
      - auth-service
      - topic-service
      - post-service
    restart: unless-stopped

  # ── Admin panel ──────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: quizhub-admin
    ports:
      - "7204:80"
    depends_on:
      - auth-service
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./quizapp
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_FIREBASE_API_KEY: "AIzaSyBcg92zjeSQCW0eoP99wY6mvT35H1rcFNQ"
        VITE_FIREBASE_AUTH_DOMAIN: "quzmyt.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "quzmyt"
        VITE_FIREBASE_STORAGE_BUCKET: "quzmyt.appspot.com"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "558270493970"
        VITE_FIREBASE_APP_ID: "1:558270493970:web:9466de6f1a3662d39e2fcb"
        VITE_FIREBASE_MEASUREMENT_ID: "G-MVVH10W1V7"
    container_name: quizhub-frontend
    ports:
      - "7203:80"
    depends_on:
      - auth-service
      - topic-service
      - question-service
      - quiz-service
      - post-service
    restart: unless-stopped

  # ── Friend service ───────────────────────────────────────
  friend-service:
    build:
      context: ./backend/friend-service
      dockerfile: Dockerfile
    container_name: quizhub-friend
    ports:
      - "7209:4006"
    env_file:
      - ./backend/friend-service/.env
    depends_on:
      - auth-service
    restart: unless-stopped

  # ── Message service ──────────────────────────────────────
  message-service:
    build:
      context: ./backend/message-service
      dockerfile: Dockerfile
    container_name: quizhub-message
    ports:
      - "7210:4007"
    env_file:
      - ./backend/message-service/.env
    depends_on:
      - auth-service
    restart: unless-stopped

volumes:
  rabbitmq_data:
