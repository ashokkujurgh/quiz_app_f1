name: meenzo
description: "Meenzo - Quiz & Social App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  permission_handler: ^11.4.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2

  # Realtime
  socket_io_client: ^3.1.6
  uuid: ^4.5.3

  # Images
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  cached_network_image: ^3.4.1

  # UI/UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  timeago: ^3.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
